<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Scooby dooby do</title>
</head>
<body>
    <h1>Inventario de la tienda "Scooby dooby do"</h1>
    <div>
        <form>
            <label for="codigo">Codigo:</label>
            <input type="text" id="codigo" name="codigo">
            <br><br>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre">
            <br><br>
            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" name="cantidad">
            <br><br>
            <label for="precio">Precio:</label>
            <input type="number" id="precio" name="precio">
            <br><br>
            <button type="button" id="btnAgregar">Agregar al inventario</button>
            <button type="button" id="btnListar">Listar</button>
            <button type="button" id="btnListarInverso">Listar Inverso</button>
            <button type="button" id="btnBuscar">Buscar</button>
            <button type="button" id="btnExtraerPrimero">Extraer Primero</button>
            <button type="button" id="btnExtraerUltimo">Extraer Ultimo</button>
            <button type="button" id="btnEliminar">Eliminar</button>
            <button type="button" id="btnAgregarInicio">Agregar al inicio</button>
            <button type="reset">Cancelar</button>
        </form>
    </div> 

    <h2>Detalles del inventario</h2>
    <div id="detalles" style="border: 1px solid black; padding: 10px; min-height: 100px;">
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
